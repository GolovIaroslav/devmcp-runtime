name: Compliance & Unit Tests

on:
  push:
    branches: [ main, master, "release-blockers-*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Linux execution sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor apparmor-profiles
          profile="$(dpkg -L apparmor-profiles | grep '/bwrap-userns-restrict$' | head -n 1)"
          if [ -z "$profile" ]; then
            echo "bwrap-userns-restrict profile not found in apparmor-profiles" >&2
            exit 1
          fi
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --unshare-user --unshare-all --cap-drop ALL --disable-userns \
            --new-session --die-with-parent --ro-bind / / -- /bin/true

      - name: Install dependencies
        # The unit discovery imports the browser suite and dogfood executes the
        # registered pytest command, so the test environment needs test extras.
        run: uv sync --all-extras

      - name: Run Test Suite
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
