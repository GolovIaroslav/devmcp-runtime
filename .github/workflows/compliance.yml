name: compliance

on:
  push:
    branches: [main, "recover-*", "audit-fix-v4", "release-blockers-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository with reachable history
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Scan current tree and all reachable Git history with Gitleaks
        uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.24.3"

      # The action's push-event default scans only the pushed range.  A public
      # release gate must also cover every reachable historical ref.
      - name: Verify current tree and full reachable history with Gitleaks
        run: |
          gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all" .
          gitleaks dir --no-banner --redact --exit-code 1 .

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Linux execution sandbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"
          ls -l "$(command -v bwrap)"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install runtime and CI tools
        run: |
          python -m pip install --upgrade pip
          # Unit discovery imports the browser-suite module; Chromium itself is
          # installed only by the dedicated public-beta browser matrix below.
          python -m pip install -e ".[dev,gui]"

      - name: Run lint
        run: make lint

      - name: Run typecheck
        run: make typecheck

      - name: Run unit discovery
        run: make test

      - name: Run protocol gate
        run: make test-protocol

      - name: Run integration gate
        run: make test-integration

      - name: Run required docs gate
        run: make test-docs-required

      - name: Run schema drift gate
        run: make test-schema-drift

      - name: Run dispatch inputs gate
        run: make check-dispatch-inputs

      - name: Run dogfood smoke
        run: make dogfood-smoke

      - name: Run latency benchmark
        run: make benchmark-latency

      - name: Validate SWE-bench smoke preflight
        run: make benchmark-smoke

      - name: Refresh full compliance report
        run: make compliance

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: compliance-evidence
          path: |
            reports/compliance/**
            reports/benchmark/**
            reports/dogfood/**
            docs/dogfood/**
          if-no-files-found: ignore
          retention-days: 14

  windows-msvc-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Locate Visual Studio C++ tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) {
            throw "Visual Studio C++ x64 tools were not found"
          }
          $vcvarsAll = Join-Path $installationPath "VC\Auxiliary\Build\vcvarsall.bat"
          if (-not (Test-Path $vcvarsAll)) {
            throw "vcvarsall.bat not found at $vcvarsAll"
          }
          "VCVARSALL=$vcvarsAll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run MSVC environment inheritance smoke
        shell: cmd
        env:
          CODING_TOOLS_MCP_PERMISSION_MODE: trusted
        run: |
          call "%VCVARSALL%" x64
          where cl.exe
          python -m unittest tests.compliance.test_windows_msvc_smoke

  public-beta-linux:
    name: Public beta full gate (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux sandbox and runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo chmod u+s "$(command -v bwrap)"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gui]"
          python -m playwright install --with-deps chromium
      - name: Run complete public-beta gate
        run: |
          make lint
          make typecheck
          make test
          make test-protocol
          make test-integration
          make test-docs-required
          make test-schema-drift
          make dogfood-smoke
          make benchmark-latency
          make benchmark-smoke
          make compliance
          make test-release-prep
          python -m unittest tests.compliance.test_docs_required
          python -m pytest -q tests/gui
      - name: Build and clean-install wheel
        run: |
          python -m pip install build
          python -m build
          clean_env="$(mktemp -d)"
          python -m venv "$clean_env/venv"
          "$clean_env/venv/bin/python" -m pip install dist/*.whl
          "$clean_env/venv/bin/devmcp" --help
          "$clean_env/venv/bin/devmcp-runtime" --help
