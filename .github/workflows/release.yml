name: Release artifact validation

# A v* tag is evidence and artifacts only. Publishing devmcp-runtime requires
# separately configured trusted publishing, and GitHub Releases stay manual.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate (branch, tag, or SHA)
        required: false
        type: string

permissions:
  contents: read

jobs:
  secret-history:
    name: Scan current tree and reachable history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.24.3"

      # The action's push-event default scans only the pushed range.  Tags are
      # release candidates, so scan all reachable history and the current tree.
      - name: Verify current tree and full reachable history with Gitleaks
        run: |
          gitleaks git --no-banner --redact --exit-code 1 --log-opts="--all" .
          gitleaks dir --no-banner --redact --exit-code 1 .

  validate-and-build:
    name: Validate and build release artifacts
    needs: secret-history
    runs-on: ubuntu-latest
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Validate release metadata for tags
        if: startsWith(github.ref, 'refs/tags/v')
        run: python scripts/check_release_versions.py --tag "$GITHUB_REF_NAME"

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Verify a clean wheel installation
        run: |
          python -m venv .package-verify
          .package-verify/bin/python -m pip install dist/*.whl
          .package-verify/bin/devmcp --version
          .package-verify/bin/python -c 'import coding_tools_mcp; assert coding_tools_mcp.__version__'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: devmcp-runtime-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7
