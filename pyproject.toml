[build-system]
requires = ["setuptools>=68,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "devmcp-runtime"
version = "0.1.0-beta.1"
description = "Local sandboxed coding runtime for MCP clients with configurable permissions and task workflows."
requires-python = ">=3.11"
dependencies = [
  "PyJWT>=2.8",
]
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "DevMCP Runtime Contributors" }]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage = "https://github.com/GolovIaroslav/devmcp-runtime"
Documentation = "https://github.com/GolovIaroslav/devmcp-runtime/tree/main/docs"
Source = "https://github.com/GolovIaroslav/devmcp-runtime"
Issues = "https://github.com/GolovIaroslav/devmcp-runtime/issues"

[project.optional-dependencies]
dev = [
    "mypy>=2.1,<2.2",
    "pytest>=8,<10",
    "PyYAML>=6.0",
    "types-PyYAML>=6.0.12",
    "types-psutil>=7.0.0",
  "ruff>=0.15,<0.16",
  "typing_extensions>=4.12",
]
desktop = [
  "PySide6>=6.8,<6.9",
  "psutil>=7.0,<8",
]
image = [
  "Pillow>=10.0",
]
gui = [
  "playwright>=1.45,<2",
]

[project.scripts]
devmcp-runtime = "coding_tools_mcp.server:main"
devmcp-desktop = "mcp_desktop_client.app:main"
# Compatibility launchers retained for existing local installations.
coding-tools-mcp = "coding_tools_mcp.server:main"
coding-tools-mcp-desktop = "mcp_desktop_client.app:main"
devmcp = "apps.devmcp.cli:main"

[tool.setuptools.packages.find]
where = [".", "apps/desktop-client"]
include = ["coding_tools_mcp*", "mcp_desktop_client*", "apps.devmcp*"]

[tool.setuptools.package-data]
mcp_desktop_client = ["locales/*.qm", "locales/*.ts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Compliance fixture projects are launched by their owning tests. They are not
# part of the runtime repository's root test collection.
norecursedirs = ["fixtures"]

[tool.mypy]
python_version = "3.11"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["PySide6.*"]
# PySide6 is an optional GUI extra and does not ship complete mypy stubs.
ignore_missing_imports = true
